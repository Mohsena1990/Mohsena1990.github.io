# Hugo Site Configuration
baseURL = "https://mohsena1990.github.io/mohsen.asghari.ilani.github.io/"
languageCode = "en-gb"
title = "Mohsen Asghari Ilani"
theme = "careercanvas"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
# Spanish and French versions are switched off for now (content still exists in content/es and content/fr)
disableLanguages = ["es", "fr"]

[languages]
  [languages.en]
    contentDir = "content/en"
    languageName = "English"
    weight = 1
    [languages.en.params]
      tagline = "PhD Researcher at Swansea University. Machine learning for socio-economic, energy and environmental risk."
      hero_description = "ESRC/UKRI-funded PhD researcher at Swansea University and Senior Data Scientist at Dotin. I build and deploy machine learning models for socio-economic, energy and environmental risk, from early warning of household fuel vulnerability to deep learning for medical and satellite imaging, with peer-reviewed work in Risk Analysis, Scientific Reports and IEEE Geoscience and Remote Sensing Letters."
      hero_location = "Cardiff, United Kingdom"
      resume_url = "/files/Mohsen_Asghari_Ilani_CV.pdf"
      collab_tags = [
        "Machine learning for risk",
        "Energy & fuel vulnerability",
        "Time-series forecasting",
        "Deep learning & computer vision",
        "Environmental data science"
      ]
  [languages.es]
    contentDir = "content/es"
    languageName = "Español"
    weight = 2
  [languages.fr]
    contentDir = "content/fr"
    languageName = "Français"
    weight = 3

[build]
  writeStats = true

[params]
name = "Mohsen Asghari Ilani"
firstName = "Mohsen"
lastName = "Asghari Ilani"
email = "ilani.a.m1990@gmail.com"
profile_image = "/images/mohsen-asghari-ilani-profile.jpg"
author = "Mohsen Asghari Ilani"

# Social preview image shown when the site is shared
og_image = "images/mohsen-asghari-ilani-profile.jpg"

description = "Mohsen Asghari Ilani: PhD researcher at Swansea University (ESRC/UKRI) and Senior Data Scientist at Dotin, working on machine learning for socio-economic, energy and environmental risk."

linkedin_url = "https://www.linkedin.com/in/mohsen-asghari-ilani"
linkedin_text = "linkedin.com/in/mohsen-asghari-ilani"
github_url = "https://github.com/Mohsena1990"
github_text = "github.com/Mohsena1990"

# Booking link removed (was Felipe's Calendly); add your own later if you want one
calendly_url = ""
calendly_height = "700px"

copyright = "Mohsen Asghari Ilani"

resume_url_en = "/files/Mohsen_Asghari_Ilani_CV.pdf"
resume_url_fr = "/files/Mohsen_Asghari_Ilani_CV.pdf"
resume_label = "View CV"

# Form and Pexels: set in config or config.local.toml. CI: HUGO_PARAMS_FORMSPREEENDPOINT, HUGO_PARAMS_PEXELSAPIKEY (no underscores)
formspreeendpoint = ""
pexelsapikey = ""

[[params.social]]
icon = "linkedin-in"
url = "https://www.linkedin.com/in/mohsen-asghari-ilani/"

[[params.social]]
icon = "github"
url = "https://github.com/Mohsena1990"

sectionPagesMenu = 'main'


[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[server]
  [[server.headers]]
    for = "/**/*.css"
    [server.headers.values]
      Content-Type = "text/css"

