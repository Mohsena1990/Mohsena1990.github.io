# Hugo Site Configuration
baseURL = "https://mohsena1990.github.io/"
languageCode = "en-gb"
title = "Mohsen Asghari Ilani"
theme = "careercanvas"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[languages]
  [languages.en]
    contentDir = "content/en"
    languageName = "English"
    weight = 1
    [languages.en.params]
      tagline = "PhD Researcher at Swansea University. Machine learning for socio-economic, energy and environmental risk."
      hero_description = "ESRC/UKRI-funded PhD researcher at Swansea University (WGSSS DTP, Management and Business pathway). I build machine learning models for socio-economic, energy and environmental risk, from energy poverty and early warning of household fuel vulnerability to market price forecasting, computer vision and NLP, with peer-reviewed work in Risk Analysis, Journal of Environmental Management, Scientific Reports and IEEE Geoscience and Remote Sensing Letters."
      hero_location = "Cardiff, United Kingdom"
      resume_url = "/files/Mohsen_Asghari_Ilani_CV.pdf"
      collab_tags = [
        "Machine learning for risk",
        "Energy poverty & fuel vulnerability",
        "Time-series forecasting",
        "Deep learning & computer vision",
        "Environmental data science"
      ]

[build]
  writeStats = true

