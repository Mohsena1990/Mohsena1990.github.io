{{ define "main" }}
<section class="pt-8 pb-12 bg-bg dark:bg-bg">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <a href="{{ .Parent.RelPermalink }}" class="inline-flex items-center text-primary dark:text-primary-light text-sm font-medium mb-6 hover:underline"><i class="fas fa-arrow-left mr-2"></i>All projects</a>
    <div class="mb-4">{{ partial "project-meta.html" . }}</div>
    <h1 class="text-3xl font-bold mb-4 font-heading text-text-primary dark:text-text-primary">{{ .Title }}</h1>
    {{ with .Params.collaborators }}<p class="text-text-secondary dark:text-text-secondary mb-4"><i class="fas fa-users mr-2"></i>{{ delimit . ", " }}</p>{{ end }}
    <div class="mb-8">{{ partial "project-links.html" . }}</div>
    {{ with .Params.featured_image }}<img src="{{ . }}" alt="{{ $.Title }}" class="w-full rounded-xl border border-border-primary mb-8" loading="lazy">{{ end }}
    <div class="prose prose-lg markdown-content dark:prose-invert prose-gray max-w-none">{{ .Content }}</div>
  </div>
</section>
{{ end }}
