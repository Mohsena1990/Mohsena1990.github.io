
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- 🔖 Dynamic title -->
<title>
  {{ if .IsHome }}
    {{ with .Site.Params.home_title }}{{ . }}{{ else }}{{ .Site.Title }} | {{ .Site.Params.tagline }}{{ end }}
  {{ else }}
    {{ .Title }} | {{ .Site.Title }}
  {{ end }}
</title>

<!-- ✅ Meta tags -->
<meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta name="author" content="{{ .Site.Params.author | default .Site.Params.name }}" />
<link rel="canonical" href="{{ .Permalink }}" />
{{ with .Site.Params.google_site_verification }}<meta name="google-site-verification" content="{{ . }}" />{{ end }}
{{ partial "structured-data.html" . }}

<!-- 🌐 Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="{{ if .IsHome }}{{ with .Site.Params.home_title }}{{ . }}{{ else }}{{ .Site.Title }} | {{ .Site.Params.tagline }}{{ end }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}" />
<meta property="og:description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:image" content="{{ with .Params.og_image }}{{ . | absURL }}{{ else }}{{ with site.Params.og_image }}{{ . | absURL }}{{ end }}{{ end }}">
<meta property="og:image:width" content="{{ .Site.Params.og_image_width | default 1200 }}" />
<meta property="og:image:height" content="{{ .Site.Params.og_image_height | default 630 }}" />
<meta property="og:site_name" content="{{ .Site.Title }}" />

<!-- 🐦 Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }} | {{ .Site.Params.tagline }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}" />
<meta name="twitter:description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta name="twitter:image" content="{{ with .Params.og_image }}{{ . | absURL }}{{ else }}{{ with site.Params.og_image }}{{ . | absURL }}{{ end }}{{ end }}" />

<!-- 🔧 Favicon -->
<link rel="icon" href="/favicon.ico" />

<!-- Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

<!-- GSAP Animation Library - Loaded dynamically from node_modules or CDN fallback -->
